<text text-anchor="start" x="13" y="-613.2" font-family="Noto Sans Mono CJK KR" font-size="11.00" fill="#d4d4d4"># 다른 공급자를 쓸 때는 예: anthropic:claude&#45;... 처럼 지정할 수 있습니다.</text>
<text text-anchor="start" x="13" y="-601.2" font-family="Noto Sans Mono CJK KR" font-size="11.00" fill="#d4d4d4">MODEL_ID = os.getenv(&quot;CHAT_MODEL&quot;, &quot;openai:gpt&#45;5.6&#45;luna&quot;)</text>
